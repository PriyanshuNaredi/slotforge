# Render Blueprint: provisions API, frontend, PostgreSQL and Redis.
# Deploy via the Render dashboard: New + > Blueprint > pick this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: slotforge-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slotforge-db
          property: connectionString
      - key: REDIS_ADDR
        fromService:
          type: keyvalue
          name: slotforge-redis
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      # Leave empty to disable email delivery (the worker skips sending).
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: slotforge-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set to the slotforge-api service URL (e.g. https://slotforge-api.onrender.com)
      # when prompted. Changing it later triggers an automatic redeploy.
      - key: API_PROXY_ORIGIN
        sync: false

  - type: keyvalue
    name: slotforge-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: slotforge-db
    databaseName: slotforge
    user: slotforge
    plan: free
